name: Weekly refresh

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Fetch PRs from GitHub
        run: npm run fetch
        env:
          # The built-in token allows 1,000 GraphQL points an hour and a run uses
          # about 320. Add a FETCH_TOKEN secret (a personal token) if that ever runs short.
          GITHUB_TOKEN: ${{ secrets.FETCH_TOKEN || github.token }}

      - name: Compute metrics
        run: npm run metrics

      # Last week's brief is removed first so it is never shown next to new numbers.
      - name: Write risks brief
        continue-on-error: true
        run: |
          rm -f site/data/brief.json
          npm run brief
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Weekly data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
